server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unmatched path falls back to index.html so
    # react-router's client-side routes (e.g. /verify/:id, /app/registry)
    # work on a hard refresh or a direct link, not just in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
