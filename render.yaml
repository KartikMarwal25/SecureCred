## Render Blueprint for SecureCred — creates the database, API, and static
## frontend in one "New Blueprint" pass from this repo.
##
## Render's free plan does not offer a Background Worker service type at
## all (paid-only), so there is no separate worker service here. Instead
## RUN_WORKER_INLINE=true tells the API process to also run the
## reconciler/event listener/batch resumer itself (see server.js) — the
## exact same modules apps/worker/ runs standalone in docker-compose, not a
## separate implementation. Tradeoff: Render's free web services sleep
## after ~15 minutes with no incoming requests, and the inline worker sleeps
## with it, resuming (with a ~30-60s cold start) on the next visit. Fine for
## a demo/exhibition someone is actively clicking through; for something
## meant to stay always-on, upgrade this service off the free plan and
## split the worker back out as its own paid Background Worker service.
##
## After the first deploy, several env vars below (marked sync: false) need
## a value pasted into the Render dashboard once the real service URLs and
## third-party keys are known — Render will prompt for each on first deploy.
##
## The free Postgres plan on Render expires 30 days after creation unless
## upgraded to a paid plan — fine for a demo/exhibition window, not for a
## deployment meant to stay up indefinitely.

databases:
  - name: securecred-db
    plan: free
    databaseName: securecred
    user: securecred

services:
  - type: web
    name: securecred-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_INLINE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: securecred-db
          property: connectionString
      # The deployed web service's URL, e.g. https://securecred-web.onrender.com
      # (no trailing slash) — fill in once the web service exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # https://<web-service-url>/verify
      - key: VERIFY_BASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: CHAIN_NETWORK
        value: amoy
      - key: RPC_URL
        value: https://polygon-amoy-bor-rpc.publicnode.com
      - key: CHAIN_ID
        value: '80002'
      - key: CONTRACT_ADDRESS
        value: '0x98324B9941Cd0bce42767AC634BA835B7c02c421'
      - key: CUSTODIAN_PRIVATE_KEY
        sync: false
      - key: CONFIRMATION_DEPTH
        value: '3'
      - key: STALL_THRESHOLD_SEC
        value: '120'
      - key: RECONCILE_INTERVAL_SEC
        value: '60'

  - type: web
    name: securecred-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    envVars:
      # https://<api-service-url>/api/v1 — baked in at build time by Vite,
      # so this must be set BEFORE the first build, not after.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
