# Full local stack for SecureCred — one command to see the whole system
# running: PostgreSQL, a local Hardhat chain, the deployed smart contract,
# the API, the background worker, and the web frontend.
#
#   docker compose up --build
#
# Clerk and Pinata are intentionally left unset below so the API's built-in
# dev-mode fallbacks activate (see apps/api/src/adapters/clerk.adapter.js and
# pinata.adapter.js) — the whole issuance -> anchor -> verify -> revoke flow
# works with zero third-party accounts. Set CLERK_*/PINATA_JWT as real
# environment overrides (e.g. in a local .env consumed by `docker compose`)
# to switch those two adapters to their real, fully-implemented paths.
#
# CUSTODIAN_PRIVATE_KEY below is Hardhat's well-known, publicly-documented
# default account #0 test key — funded with 10000 test ETH on any Hardhat
# node and worthless anywhere else. Never reuse a well-known test key for
# anything real.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securecred
    volumes:
      - securecred_pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  chain:
    build:
      context: .
      dockerfile: docker/chain.Dockerfile
    ports:
      - '8545:8545'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "wget -q -O- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 | grep -q result",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  deploy-contract:
    build:
      context: .
      dockerfile: docker/chain.Dockerfile
    depends_on:
      chain:
        condition: service_healthy
    environment:
      CHAIN_RPC_URL: http://chain:8545
      CUSTODIAN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
      CUSTODIAN_ADDRESS: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
    volumes:
      - contract_deployments:/app/contracts/deployments
    command: ['npx', 'hardhat', 'run', 'scripts/deploy.js', '--network', 'dockerchain']

  migrate:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/securecred
    command: ['node', 'migrate.js', 'up']

  seed:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://securecred_app:securecred_dev_password@postgres:5432/securecred
    command: ['node', 'seeds/seed.js']

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
      deploy-contract:
        condition: service_completed_successfully
    ports:
      - '4000:4000'
    volumes:
      - contract_deployments:/app/contracts/deployments:ro
    environment:
      NODE_ENV: development
      PORT: 4000
      VERIFY_BASE_URL: http://localhost:5173/verify
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgres://securecred_app:securecred_dev_password@postgres:5432/securecred
      CLERK_SECRET_KEY: ''
      PINATA_JWT: ''
      CHAIN_NETWORK: dockerchain
      RPC_URL: http://chain:8545
      CHAIN_ID: '1337'
      CONFIRMATION_DEPTH: '1'
      CUSTODIAN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:4000/api/v1/health']
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - contract_deployments:/app/contracts/deployments:ro
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://securecred_app:securecred_dev_password@postgres:5432/securecred
      CHAIN_NETWORK: dockerchain
      RPC_URL: http://chain:8545
      CHAIN_ID: '1337'
      CONFIRMATION_DEPTH: '1'
      CUSTODIAN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
      STALL_THRESHOLD_SEC: '120'
      RECONCILE_INTERVAL_SEC: '60'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api/v1
        VITE_CLERK_PUBLISHABLE_KEY: ''
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:80'

volumes:
  securecred_pgdata:
  contract_deployments:
