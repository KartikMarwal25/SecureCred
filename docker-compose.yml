# Full local stack for SecureCred — one command to see the whole system
# running: PostgreSQL, the API, the background worker, and the web frontend.
#
#   docker compose up --build
#
# Every value below that isn't hardcoded (Clerk keys, Pinata JWT, and —
# since this stack anchors straight to the real Polygon Amoy testnet, not a
# disposable local chain — CHAIN_NETWORK/RPC_URL/CHAIN_ID/CONTRACT_ADDRESS/
# CUSTODIAN_PRIVATE_KEY) is read from a repo-root `.env` file (docker
# compose loads that automatically for ${VAR} substitution). Clerk/Pinata
# default to empty if `.env` doesn't set them, which activates the API's
# built-in dev-mode fallbacks (see apps/api/src/adapters/clerk.adapter.js
# and pinata.adapter.js).
#
# There used to be a separate, throwaway local Hardhat chain here (see
# docker/chain.Dockerfile, still in the repo but unused) — every restart of
# that container wiped every certificate anchored on it, since Hardhat's
# node keeps its whole chain state in memory with nothing written to disk.
# Anchoring straight to the real, persistent Amoy testnet instead means
# nothing issued locally is ever lost to a Docker restart again — gas cost
# is negligible (well under a cent per certificate at Amoy's typical gas
# price). `contracts/deployments/` is bind-mounted read-only from the host
# so the containers see the real deployment record already committed there.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securecred
    volumes:
      - securecred_pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/securecred
    command: ['node', 'migrate.js', 'up']

  seed:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://securecred_app:securecred_dev_password@postgres:5432/securecred
    command: ['node', 'seeds/seed.js']

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - '4000:4000'
    volumes:
      - ./contracts/deployments:/app/contracts/deployments:ro
    environment:
      NODE_ENV: development
      PORT: 4000
      VERIFY_BASE_URL: http://localhost:5173/verify
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgres://securecred_app:securecred_dev_password@postgres:5432/securecred
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      PINATA_JWT: ${PINATA_JWT:-}
      CHAIN_NETWORK: ${CHAIN_NETWORK}
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CONFIRMATION_DEPTH: ${CONFIRMATION_DEPTH:-1}
      CUSTODIAN_PRIVATE_KEY: ${CUSTODIAN_PRIVATE_KEY}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:4000/api/v1/health']
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./contracts/deployments:/app/contracts/deployments:ro
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://securecred_app:securecred_dev_password@postgres:5432/securecred
      CHAIN_NETWORK: ${CHAIN_NETWORK}
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      CONFIRMATION_DEPTH: ${CONFIRMATION_DEPTH:-1}
      CUSTODIAN_PRIVATE_KEY: ${CUSTODIAN_PRIVATE_KEY}
      STALL_THRESHOLD_SEC: '120'
      RECONCILE_INTERVAL_SEC: '60'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api/v1
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:80'

volumes:
  securecred_pgdata:
